[versions]
agp = "8.13.2"
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
lifecycle = "2.10.0"
coreKtx = "1.16.0"
junit4 = "4.13.2"
robolectric = "4.16.1"
coroutinesTest = "1.11.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.3.0"
# Phase 3 P3-C1（計画書§6.4#1・§7.1）。現在地取得（F22）用。AARメタデータ実測
# （2026-08-09、計画メモ§0）: minCompileSdk=1 / minAndroidGradlePluginVersion=1.0.0
# のため compileSdk 35・AGP 8.13.2（ADR-0007）のまま導入可能（ADR-0011型リスクなし）。
playServicesLocation = "21.4.0"
# Phase 7 P7-C0/C1（計画書§14 P7-C0・F85・U-2・R-2）: LiteRT-LM Kotlin API。P7-C0で
# ResponseFormat.json(schema)のGO判定を実測済み（コミット8967693）。バージョンは0.15.0に
# 固定し自動更新しない（`ResponseFormat`が公式Webドキュメント未掲載でAPI変更リスクがあるため）。
litertlmAndroid = "0.15.0"
# Phase 7 P7-C2（計画書§7.2・§12.1・U-11・Gemini G1 CRITICAL #5）: SchemaValidatorのテストを
# Robolectric不要のE1（純JVM）で実行するためのpure Java org.json実装。本番コードは引き続き
# Android SDK同梱のorg.jsonを使用し、本依存はtestImplementationのみに限定する（U-11裁定）。
# バージョンはMaven Central実測（2026-08-10、search.maven.org）で確認した最新安定版。
orgJson = "20250517"
# Phase 10 C1（計画書`docs/plans/phase10-behavior-log-profile.md`§3.1・§6）: 本プロジェクト初のDB。
# バージョンはContext7（developer.android.com公式ドキュメントscrape、High reputation source）で
# 実測確認した最新安定版（2026-08-12）。
room = "2.8.4"
# Phase 10 C1: KSPコンパイラ処理。バージョンはKotlin本体（2.4.10）とは独立した番号体系（KSP2、
# `<kotlin>-<ksp>`複合形式ではなくKSP自身の単独バージョン）。GitHub Releases実測（gh api、
# 2026-08-12）時点の最新は2.3.11で、Kotlin 2.4.10向けの明示的な組は未公開——KSPがKotlinの
# 最新マイナー版へ追従するまでにタイムラグがあるという既知パターン（計画書§6「未確定事項」
# 参照）。ビルド実行時に非互換エラーが出た場合はKSPの新しいリリースを再確認する。
ksp = "2.3.11"

[libraries]
